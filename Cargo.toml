[package]
name = "everdude"
version = "0.1.0"
edition = "2024"
description = "Fast, lossless-binary-scalable Unix UTC <-> everdude half-week time converter"

[lib]
name = "everdude"
path = "src/lib.rs"

[[bin]]
name = "everdude"
path = "src/main.rs"

[features]
default = []
capi = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
